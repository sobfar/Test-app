<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>تنظیم برد</title>
  <style>
* { box-sizing: border-box; }
button { font-family: inherit; font-size: inherit; }
body {
  margin: 0;
  font-family: -apple-system, Tahoma, Arial, sans-serif;
  background: radial-gradient(circle at 30% 0%, #2a0e42 0%, #12061f 45%, #05030a 100%);
  color: #f1eef7;
  height: 100vh;
  overflow: hidden;
}
.screen {
  display: none;
  flex-direction: column;
  height: 100vh;
  padding: max(16px, env(safe-area-inset-top)) 16px calc(16px + 64px + env(safe-area-inset-bottom));
}
.screen.active { display: flex; }

header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
header h1 {
  font-size: 18px;
  margin: 0;
  flex: 1;
  color: #f4eefb;
}
.icon-btn {
  background: linear-gradient(145deg, #2b1240, #1a0b2e);
  border: 1px solid rgba(168, 85, 247, 0.25);
  color: #e9d5ff;
  width: 40px;
  height: 40px;
  border-radius: 12px;
  font-size: 17px;
  flex-shrink: 0;
}
.hint { color: #b8a8cc; font-size: 14px; margin: 0 0 12px; }

.status-box {
  padding: 10px 14px;
  border-radius: 10px;
  margin-bottom: 10px;
  font-size: 14px;
}
.status-box.error { background: #3a1030; color: #ff8ad4; border: 1px solid rgba(255,138,212,0.25); }
.status-box.success { background: #1c3a2a; color: #7fe0a8; border: 1px solid rgba(127,224,168,0.25); }
.hidden { display: none !important; }

.form-box { display: flex; flex-direction: column; gap: 10px; }
.form-box label { font-size: 14px; color: #cbb8e0; }
.form-box input[type="password"],
.form-box input[type="number"] {
  background: rgba(20, 9, 35, 0.7);
  border: 1px solid rgba(168, 85, 247, 0.3);
  color: #fff;
  padding: 12px;
  border-radius: 12px;
  font-size: 15px;
}
.checkbox-row { display: flex; align-items: center; gap: 6px; color: #cbb8e0; }

.primary-btn {
  background: linear-gradient(135deg, #a855f7, #6d28d9);
  color: #fff;
  border: none;
  padding: 14px;
  border-radius: 14px;
  font-size: 15px;
  margin-top: 8px;
  box-shadow: 0 6px 20px rgba(168, 85, 247, 0.35);
}
.secondary-btn {
  background: rgba(88, 28, 135, 0.2);
  color: #e9d5ff;
  border: 1px solid rgba(168, 85, 247, 0.3);
  padding: 12px;
  border-radius: 14px;
  font-size: 14px;
  margin-top: 6px;
  width: 100%;
}
.scroll-form { overflow-y: auto; flex: 1; }
.section-divider {
  margin-top: 14px;
  padding-top: 10px;
  border-top: 1px solid rgba(168, 85, 247, 0.2);
  color: #a855f7;
  font-size: 13px;
}

.extract-output {
  flex: 1;
  width: 100%;
  background: rgba(10, 4, 18, 0.85);
  color: #c9a8ff;
  border: 1px solid rgba(168, 85, 247, 0.25);
  border-radius: 12px;
  padding: 10px;
  font-family: monospace;
  font-size: 12px;
  margin-top: 10px;
  direction: ltr;
  text-align: left;
}

/* ---------------- نوار پایین (تب‌بار) ---------------- */
.tab-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  gap: 6px;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  background: linear-gradient(180deg, rgba(21, 8, 38, 0.85), rgba(8, 3, 15, 0.98));
  border-top: 1px solid rgba(168, 85, 247, 0.2);
  backdrop-filter: blur(10px);
  z-index: 30;
}
.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 8px 4px;
  border-radius: 14px;
  color: #8a7aa3;
  font-size: 11px;
  font-family: inherit;
  background: none;
  border: none;
  appearance: none;
  -webkit-appearance: none;
  transition: color 0.15s ease, background 0.15s ease;
}
.tab-item .tab-icon { font-size: 19px; line-height: 1; }
.tab-item.active {
  color: #f1eef7;
  background: linear-gradient(135deg, rgba(168, 85, 247, 0.28), rgba(109, 40, 217, 0.18));
}

  </style>
</head>
<body>

  <!-- صفحه اصلی: کنترل صفحه تنظیمات برد (با InAppBrowser) -->
  <section id="screen-board" class="screen active">
    <header>
      <h1>تنظیمات برد</h1>
      <button id="btn-edit-values" class="icon-btn" title="ویرایش مقادیر">⚙️</button>
    </header>

    <p class="hint">اول مقادیر کالیبراسیون رو در بخش ⚙️ چک کن، بعد یکی از گزینه‌های زیر رو بزن.</p>

    <div class="form-box">
      <button id="btn-open-fill" class="primary-btn">باز کردن صفحه برد و پر کردن خودکار</button>
      <button id="btn-open-only" class="secondary-btn">فقط باز کردن صفحه برد (بدون پر کردن)</button>
      <button id="btn-extract-html" class="secondary-btn">استخراج HTML صفحه (برای بررسی و اصلاح بعدی)</button>
    </div>

    <div id="board-status" class="status-box hidden"></div>

    <textarea id="extract-output" class="extract-output hidden" readonly placeholder="خروجی HTML اینجا نمایش داده می‌شه..."></textarea>
    <button id="btn-copy-html" class="secondary-btn hidden">کپی کردن HTML</button>
  </section>

  <!-- صفحه: ویرایش مقادیر کالیبراسیون -->
  <section id="screen-values" class="screen">
    <header>
      <h1>مقادیر تنظیمات اولیه</h1>
    </header>
    <div class="form-box scroll-form">
      <label>حداکثر ولتاژ ورودی</label>
      <input type="number" id="val-vmax" />

      <label>حداقل ولتاژ ورودی</label>
      <input type="number" id="val-vmin" />

      <label>هیستریزیس</label>
      <input type="number" id="val-hyst" />

      <label>تأخیر محافظ</label>
      <input type="number" id="val-delay" />

      <label>حد زیربار</label>
      <input type="number" id="val-under" />

      <label>کالیبراسیون ولتاژ خروجی</label>
      <input type="number" id="val-calout" />

      <label>کالیبراسیون ولتاژ ورودی</label>
      <input type="number" id="val-calin" />

      <label>ضریب کالیبراسیون</label>
      <input type="number" id="val-coeff" />

      <div class="section-divider">آستانه‌های ولتاژ رله‌ها</div>

      <label>رله ۱ (بالاترین ولتاژ) — آستانه</label>
      <input type="number" id="val-relay1" />

      <label>رله ۲ — آستانه</label>
      <input type="number" id="val-relay2" />

      <label>رله ۳ (پایین‌ترین ولتاژ) — آستانه</label>
      <input type="number" id="val-relay3" />

      <button id="btn-save-values" class="primary-btn">ذخیره مقادیر</button>
    </div>
  </section>

  <!-- نوار پایین -->
  <nav id="tab-bar" class="tab-bar">
    <button class="tab-item" data-screen="board">
      <span class="tab-icon">🖥️</span>
      <span>برد</span>
    </button>
    <button class="tab-item" data-screen="values">
      <span class="tab-icon">⚙️</span>
      <span>مقادیر</span>
    </button>
  </nav>

  <script type="module">
// ---------------------------------------------
// تنظیمات
// ---------------------------------------------
import { InAppBrowser } from '@capgo/capacitor-inappbrowser';

const BOARD_URL = 'http://192.168.4.1';
const BOARD_USERNAME = 'admin';
const BOARD_PASSWORD = 'makoran';
// یوزرنیم/رمز رو مستقیم توی URL می‌ذاریم تا WebView خودکار با Basic Auth وارد بشه
// و دیگه نیازی به وارد کردن دستی admin/makoran هر بار نباشه.
const BOARD_URL_AUTH = BOARD_URL.replace('http://', 'http://' + encodeURIComponent(BOARD_USERNAME) + ':' + encodeURIComponent(BOARD_PASSWORD) + '@');
const STORAGE_KEY = 'board_calibration_values';

const DEFAULT_VALUES = {
  vmax: 240,
  vmin: 100,
  hyst: 7,
  delay: 5,
  under: 100,
  calout: 485,
  calin: 485,
  coeff: 90,
  relay1: 205,
  relay2: 195,
  relay3: 175,
};

function getBrowser() {
  if (!InAppBrowser) console.warn('پلاگین InAppBrowser در دسترس نیست (روی مرورگر معمولی کار نمی‌کنه).');
  return InAppBrowser;
}

const screens = {
  board: document.getElementById('screen-board'),
  values: document.getElementById('screen-values'),
};
function showScreen(name) {
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[name].classList.add('active');
  document.querySelectorAll('.tab-item').forEach(t => {
    t.classList.toggle('active', t.getAttribute('data-screen') === name);
  });
}

const valueFieldIds = ['vmax', 'vmin', 'hyst', 'delay', 'under', 'calout', 'calin', 'coeff', 'relay1', 'relay2', 'relay3'];

function loadValues() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : Object.assign({}, DEFAULT_VALUES);
  } catch (e) {
    return Object.assign({}, DEFAULT_VALUES);
  }
}
function saveValues(values) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(values));
}
function fillValueInputs(values) {
  valueFieldIds.forEach(id => {
    document.getElementById('val-' + id).value = values[id];
  });
}
function readValueInputs() {
  const values = {};
  valueFieldIds.forEach(id => {
    values[id] = document.getElementById('val-' + id).value;
  });
  return values;
}

document.getElementById('btn-edit-values').addEventListener('click', () => {
  fillValueInputs(loadValues());
  showScreen('values');
});
document.getElementById('btn-save-values').addEventListener('click', () => {
  saveValues(readValueInputs());
  showScreen('board');
});

const boardStatusEl = document.getElementById('board-status');
function setBoardStatus(message, type) {
  boardStatusEl.textContent = message;
  boardStatusEl.className = 'status-box ' + (type || '');
  boardStatusEl.classList.remove('hidden');
}
function clearBoardStatus() { boardStatusEl.classList.add('hidden'); }

const PANEL_LABELS = ['تنظیمات پیشرفته', 'تنظیم آستانه‌های ولتاژ', 'تنظیم آستانه های ولتاژ'];

// این تابع به‌صورت متن (toString) داخل صفحه‌ی برد تزریق و اجرا می‌شه، پس نمی‌تونه
// به هیچ متغیر یا تابعی خارج از خودش دسترسی داشته باشه — همه‌چیز باید خودکفا باشه.
async function fillFieldsImpl(fieldMap, relayFields, panelLabels) {
  var results = {};
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function norm(t) { return (t || '').toLowerCase().replace(/\s+/g, ''); }

  function findClickable(labelText) {
    var all = Array.from(document.querySelectorAll('button, a, div, span, li'));
    var exact = all.find(function (el) {
      return el.children.length === 0 && norm(el.textContent) === norm(labelText);
    });
    if (exact) return exact.closest('button, a, [role="button"]') || exact;
    var partial = all.find(function (el) {
      return el.children.length === 0 && norm(el.textContent).indexOf(norm(labelText)) !== -1;
    });
    if (partial) return partial.closest('button, a, [role="button"]') || partial;
    return null;
  }
  // بعضی رابط‌ها به‌جای click ساده به pointerdown/touchstart واکنش می‌دن؛
  // برای سازگاری بیشتر، زنجیره‌ی رویدادهای یه لمس/کلیک واقعی رو شبیه‌سازی می‌کنیم.
  function simulateClick(el) {
    var rect = el.getBoundingClientRect();
    var x = rect.left + rect.width / 2;
    var y = rect.top + rect.height / 2;
    var opts = { bubbles: true, cancelable: true, view: window, clientX: x, clientY: y };
    ['pointerdown', 'mousedown', 'pointerup', 'mouseup', 'click'].forEach(function (type) {
      try {
        var EventCtor = type.indexOf('pointer') === 0 && window.PointerEvent ? PointerEvent : MouseEvent;
        el.dispatchEvent(new EventCtor(type, opts));
      } catch (e) { /* بعضی مرورگرها PointerEvent ندارن، بی‌خیال اون نوع می‌شیم */ }
    });
    el.click();
  }
  function findByAttrs(keywords) {
    var inputs = Array.from(document.querySelectorAll('input, select'));
    for (var i = 0; i < inputs.length; i++) {
      var el = inputs[i];
      var hay = norm((el.name || '') + ' ' + (el.id || '') + ' ' + (el.placeholder || ''));
      for (var k = 0; k < keywords.length; k++) {
        if (hay.indexOf(norm(keywords[k])) !== -1) return el;
      }
    }
    return null;
  }
  function findByLabelText(keywords) {
    var candidates = Array.from(document.querySelectorAll('label, td, span, div, p, b, strong'));
    for (var i = 0; i < candidates.length; i++) {
      var el = candidates[i];
      if (el.children.length > 0) continue;
      var text = norm(el.textContent);
      for (var k = 0; k < keywords.length; k++) {
        if (text.indexOf(norm(keywords[k])) === -1) continue;
        if (el.tagName === 'LABEL' && el.htmlFor) {
          var t = document.getElementById(el.htmlFor);
          if (t) return t;
        }
        var row = el.closest('tr, li') || el.parentElement;
        if (row) {
          var input = row.querySelector('input, select');
          if (input) return input;
        }
        var sib = el.nextElementSibling;
        while (sib) {
          if (sib.matches && sib.matches('input, select')) return sib;
          sib = sib.nextElementSibling;
        }
      }
    }
    return null;
  }
  // برای فیلدهایی مثل «رله ۱ / رله ۲ / رله ۳» که چند کارت مشابه با یه لیبل عددی دارن:
  // اول متنی که دقیقاً شامل «رله N» هست رو پیدا می‌کنه، بعد توی کارت (چند سطح والد) دنبال اولین input می‌گرده.
  function findByCardNumber(cardKeyword, number) {
    var all = Array.from(document.querySelectorAll('*'));
    var re = new RegExp(norm(cardKeyword) + number + '(?![0-9])');
    var labelEl = all.find(function (el) {
      return el.children.length === 0 && re.test(norm(el.textContent));
    });
    if (!labelEl) return null;
    var container = labelEl;
    for (var i = 0; i < 6 && container; i++) {
      if (container.querySelector) {
        var input = container.querySelector('input, select');
        if (input) return input;
      }
      container = container.parentElement;
    }
    return null;
  }

  function fillVisibleFields() {
    Object.keys(fieldMap).forEach(function (key) {
      if (results[key] === 'پیدا و پر شد') return;
      var f = fieldMap[key];
      var target = findByAttrs(f.keywords) || findByLabelText(f.keywords);
      if (target) {
        target.focus();
        target.value = target.tagName === 'SELECT' ? String(f.value) : f.value;
        target.dispatchEvent(new Event('input', { bubbles: true }));
        target.dispatchEvent(new Event('change', { bubbles: true }));
        results[key] = 'پیدا و پر شد';
      } else if (!results[key]) {
        results[key] = 'پیدا نشد';
      }
    });
    Object.keys(relayFields).forEach(function (key) {
      if (results[key] === 'پیدا و پر شد') return;
      var r = relayFields[key];
      var target = findByCardNumber(r.cardKeyword, r.number);
      if (target) {
        target.focus();
        target.value = r.value;
        target.dispatchEvent(new Event('input', { bubbles: true }));
        target.dispatchEvent(new Event('change', { bubbles: true }));
        results[key] = 'پیدا و پر شد';
      } else if (!results[key]) {
        results[key] = 'پیدا نشد';
      }
    });
  }

  fillVisibleFields();
  for (var p = 0; p < panelLabels.length; p++) {
    var btn = findClickable(panelLabels[p]);
    if (btn) { simulateClick(btn); await wait(1600); fillVisibleFields(); }
  }

  var allKeys = Object.keys(fieldMap).concat(Object.keys(relayFields));
  var resultLines = allKeys.map(function (k) { return k + ': ' + (results[k] || 'پیدا نشد'); });
  if (window.mobileApp) window.mobileApp.postMessage({ detail: { type: 'fillResult', results: resultLines } });
}

function buildFillScript(values) {
  const fieldMap = {
    vmax:   { value: values.vmax,   keywords: ['vmax', 'v_max', 'maxv', 'حداکثر'] },
    vmin:   { value: values.vmin,   keywords: ['vmin', 'v_min', 'minv', 'حداقل'] },
    hyst:   { value: values.hyst,   keywords: ['hyst', 'هیستر'] },
    delay:  { value: values.delay,  keywords: ['delay', 'تاخیر', 'تأخیر'] },
    under:  { value: values.under,  keywords: ['under', 'زیربار', 'زیر بار'] },
    calout: { value: values.calout, keywords: ['calout', 'cal_out', 'خروج'] },
    calin:  { value: values.calin,  keywords: ['calin', 'cal_in', 'ورودی'] },
    coeff:  { value: values.coeff,  keywords: ['coeff', 'ضریب', 'k_cal'] },
  };
  const relayFields = {
    relay1: { value: values.relay1, cardKeyword: 'رله', number: 1 },
    relay2: { value: values.relay2, cardKeyword: 'رله', number: 2 },
    relay3: { value: values.relay3, cardKeyword: 'رله', number: 3 },
  };
  return `(${fillFieldsImpl.toString()})(${JSON.stringify(fieldMap)}, ${JSON.stringify(relayFields)}, ${JSON.stringify(PANEL_LABELS)});`;
}

// همون منطق پیدا کردن پنل‌ها، ولی به‌جای پرکردن، فقط HTML هر مرحله رو برمی‌گردونه
async function extractHtmlImpl(panelLabels) {
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function norm(t) { return (t || '').toLowerCase().replace(/\s+/g, ''); }
  function findClickable(labelText) {
    var all = Array.from(document.querySelectorAll('button, a, div, span, li'));
    var exact = all.find(function (el) {
      return el.children.length === 0 && norm(el.textContent) === norm(labelText);
    });
    if (exact) return exact.closest('button, a, [role="button"]') || exact;
    var partial = all.find(function (el) {
      return el.children.length === 0 && norm(el.textContent).indexOf(norm(labelText)) !== -1;
    });
    if (partial) return partial.closest('button, a, [role="button"]') || partial;
    return null;
  }
  function simulateClick(el) {
    var rect = el.getBoundingClientRect();
    var x = rect.left + rect.width / 2;
    var y = rect.top + rect.height / 2;
    var opts = { bubbles: true, cancelable: true, view: window, clientX: x, clientY: y };
    ['pointerdown', 'mousedown', 'pointerup', 'mouseup', 'click'].forEach(function (type) {
      try {
        var EventCtor = type.indexOf('pointer') === 0 && window.PointerEvent ? PointerEvent : MouseEvent;
        el.dispatchEvent(new EventCtor(type, opts));
      } catch (e) { /* بعضی مرورگرها PointerEvent ندارن */ }
    });
    el.click();
  }

  var snapshots = ['--- صفحه اصلی ---\n' + document.documentElement.outerHTML];
  for (var p = 0; p < panelLabels.length; p++) {
    var btn = findClickable(panelLabels[p]);
    if (btn) {
      simulateClick(btn);
      await wait(1600);
      snapshots.push('--- بعد از کلیک روی: ' + panelLabels[p] + ' ---\n' + document.documentElement.outerHTML);
    }
  }
  var html = snapshots.join('\n\n');
  if (window.mobileApp) window.mobileApp.postMessage({ detail: { type: 'htmlExtract', html: html } });
}

const EXTRACT_SCRIPT = `(${extractHtmlImpl.toString()})(${JSON.stringify(PANEL_LABELS)});`;


let messageListenerAttached = false;
function attachBrowserMessageListener() {
  const Browser = getBrowser();
  if (!Browser || messageListenerAttached) return;
  messageListenerAttached = true;
  Browser.addListener('messageFromWebview', (event) => {
    const detail = event && event.detail;
    if (!detail) return;
    if (detail.type === 'fillResult') {
      alert('نتیجه پر کردن فیلدها:\n\n' + detail.results.join('\n'));
    } else if (detail.type === 'htmlExtract') {
      const out = document.getElementById('extract-output');
      out.value = detail.html;
      out.classList.remove('hidden');
      document.getElementById('btn-copy-html').classList.remove('hidden');
      setBoardStatus('HTML استخراج شد؛ می‌تونی کپی و برای بررسی بفرستی.', 'success');
    }
  });
}

document.getElementById('btn-open-fill').addEventListener('click', async () => {
  const Browser = getBrowser();
  if (!Browser) { setBoardStatus('پلاگین InAppBrowser در دسترس نیست.', 'error'); return; }
  attachBrowserMessageListener();
  clearBoardStatus();
  try {
    const res = await Browser.openWebView({
      url: BOARD_URL_AUTH,
      title: 'تنظیمات برد',
      showReloadButton: true,
      toolbarType: 'default',
      isPresentAfterPageLoad: true,
    });
    setTimeout(async () => {
      const values = loadValues();
      await Browser.executeScript({ id: res.id, code: buildFillScript(values) });
    }, 1500);
  } catch (err) {
    console.error(err);
    setBoardStatus('خطا در باز کردن صفحه برد: ' + (err.message || err), 'error');
  }
});

document.getElementById('btn-open-only').addEventListener('click', async () => {
  const Browser = getBrowser();
  if (!Browser) { setBoardStatus('پلاگین InAppBrowser در دسترس نیست.', 'error'); return; }
  clearBoardStatus();
  try {
    await Browser.openWebView({
      url: BOARD_URL_AUTH,
      title: 'تنظیمات برد',
      showReloadButton: true,
      toolbarType: 'default',
    });
  } catch (err) {
    console.error(err);
    setBoardStatus('خطا در باز کردن صفحه برد: ' + (err.message || err), 'error');
  }
});

document.getElementById('btn-extract-html').addEventListener('click', async () => {
  const Browser = getBrowser();
  if (!Browser) { setBoardStatus('پلاگین InAppBrowser در دسترس نیست.', 'error'); return; }
  attachBrowserMessageListener();
  clearBoardStatus();
  setBoardStatus('در حال بارگذاری صفحه برد برای استخراج...', '');
  try {
    const res = await Browser.openWebView({
      url: BOARD_URL_AUTH,
      title: 'در حال استخراج...',
      isPresentAfterPageLoad: true,
    });
    setTimeout(async () => {
      await Browser.executeScript({ id: res.id, code: EXTRACT_SCRIPT });
      setTimeout(() => Browser.close({ id: res.id }), 2200);
    }, 1500);
  } catch (err) {
    console.error(err);
    setBoardStatus('خطا در استخراج HTML: ' + (err.message || err), 'error');
  }
});

document.getElementById('btn-copy-html').addEventListener('click', () => {
  const out = document.getElementById('extract-output');
  out.select();
  document.execCommand('copy');
  setBoardStatus('کپی شد.', 'success');
});

// ---------------------------------------------
// نوار پایین
// ---------------------------------------------
document.querySelectorAll('.tab-item').forEach(tab => {
  tab.addEventListener('click', () => {
    const target = tab.getAttribute('data-screen');
    if (target === 'values') {
      fillValueInputs(loadValues());
    }
    showScreen(target);
  });
});

window.addEventListener('DOMContentLoaded', () => {
  fillValueInputs(loadValues());
  showScreen('board');
});

  </script>
